# MockTab — manual backup release build.
#
# Run manually (Actions tab → Release → Run workflow, entering the existing
# tag e.g. v0.2.3) to build, sign, notarize, and staple the .app and DMG for
# an already-tagged version, then create a DRAFT GitHub Release with the DMG
# attached. Nothing is public until you click Publish on GitHub.
#
# `tools/release/release-and-publish.sh` is the primary release path and does all of
# this locally. This workflow is a manual-only backup for when that isn't
# available (e.g. away from the signing Mac) — it does NOT trigger on tag
# push, specifically so running the local script never also fires this
# workflow. If you do run both for the same tag, whichever creates the
# GitHub Release first wins; the second will error trying to create a
# duplicate.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_CERT_P12       base64 of the "Developer ID Application" cert
#                               exported as a .p12  (base64 -i cert.p12 | pbcopy)
#   DEVELOPER_ID_CERT_PASSWORD  the password set when exporting that .p12
#   NOTARY_APPLE_ID             Apple ID email used for notarization
#   NOTARY_PASSWORD             app-specific password for that Apple ID
# Team ID (3R62GZR6Q2) is not secret and is read from tools/release/ExportOptions.plist.
#
# NOTE: GitHub-hosted runners ship a fixed set of Xcode versions. MockTab is
# developed against Xcode 26 / the macOS 26 SDK; if the runner's newest Xcode is
# older and the build fails on missing SDK symbols, pin a version with the
# `Select Xcode` step below (uncomment and set a path that `ls /Applications`
# shows on the runner).

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (e.g. v0.2.3)'
        required: true
        type: string

permissions:
  contents: write          # create the GitHub Release

jobs:
  release:
    # macOS 27 prep: `macos-26` now exists (it is `macos-latest`) and carries
    # Xcode 26.6 as the image default, so the "Select Xcode" step below stays
    # unnecessary. Deliberately still pinned here: tests.yml and snapshot.yml
    # moved first, and snapshot notarizes a real DMG. Move this only after a
    # snapshot run has notarized cleanly on macos-26 — a release is the wrong
    # place to discover a signing or notarization difference.
    runs-on: macos-15
    env:
      NOTARY_TEAM_ID: 3R62GZR6Q2
    steps:
      - name: Skip if release already exists
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release $TAG already exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag (with submodules)
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      # macOS 27 prep: enable alongside the macos-26 runner above to build
      # against the newer SDK. Adjust the version to whatever Xcode the image
      # provides (check available paths with `ls /Applications | grep Xcode`).
      # - name: Select Xcode
      #   if: steps.precheck.outputs.skip != 'true'
      #   run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Show toolchain
        if: steps.precheck.outputs.skip != 'true'
        run: xcodebuild -version

      - name: Verify tag matches MARKETING_VERSION
        if: steps.precheck.outputs.skip != 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          MV=$(xcodebuild -project MockTab.xcodeproj -scheme MockTab -configuration Release \
              -showBuildSettings 2>/dev/null | awk '/ MARKETING_VERSION = /{print $3; exit}')
          if [[ "$VERSION" != "$MV" ]]; then
            echo "::error::tag $TAG does not match MARKETING_VERSION $MV — checked-out ref may be wrong" >&2
            exit 1
          fi
          echo "Releasing MockTab $VERSION"

      - name: Import Developer ID certificate
        if: steps.precheck.outputs.skip != 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -base64 24)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
              -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain first in the search list so xcodebuild/codesign find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize, package
        if: steps.precheck.outputs.skip != 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: tools/release/release.sh

      - name: Create draft GitHub Release
        if: steps.precheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          DMG="dist/MockTab-$VERSION.dmg"
          NOTES="release-notes/v${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" "$DMG" \
              --title "MockTab $VERSION" --notes-file "$NOTES" --draft
          else
            gh release create "$TAG" "$DMG" \
              --title "MockTab $VERSION" --generate-notes --draft
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
