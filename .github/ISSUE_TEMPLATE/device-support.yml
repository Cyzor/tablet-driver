name: Device support request
description: Tablet that MockTab doesn't recognize, or only partly drives
title: "Device support: "
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        Run **Help › Collect Device Data…** in MockTab with the tablet connected, then attach the zip below.

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "e.g. Intuos Pro M (PTH-660)"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Bluetooth
        - USB wireless dongle
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 27.0"
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What works
      description: Pen tracking, pressure, tilt, buttons, touch, rings or dials — which work and which don't?
    validations:
      required: false

  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: The zip from Collect Device Data. Drag it into this box.
      placeholder: Drop the zip here.
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: Checklist
      options:
        - label: No existing issue covers this tablet.
          required: true
        - label: The capture came from this tablet.
          required: true
