name: Bug report
description: Report a problem with MockTab on supported hardware
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** in MockTab, open the Info pane and press **Copy Diagnostics** to bundle your driver state into a text block. Paste it in the **Diagnostics** field below.

        **If your tablet is connected, please also use *Collect Device Data…* in the same Info tab** and paste the result in the **Capture data** field, even if the bug doesn't look device-related. It's most valuable for anything involving the pen, touch, or buttons — that's what lets a fix be verified against your exact hardware state later without needing you to come back and retest — but it also helps in less direct ways (e.g. catching an unrelated device quirk while it's on hand). Skip it for bugs with no device angle at all (a mislabeled menu item, a UI color, etc.).

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.4"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Tablet model
      placeholder: "e.g. Intuos Pro Medium PTH-660"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of Info pane → Copy Diagnostics.
      placeholder: |
        ```
        <paste diagnostics output here>
        ```
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: Capture data
      description: |
        Paste the JSON from Info pane → Collect Device Data…, ideally while reproducing the bug. Worth including even if the bug seems unrelated to your device — it's cheap to grab and can turn out useful in ways that aren't obvious upfront. Leave blank only for bugs with no device angle (UI, menus, settings, etc.).
      placeholder: |
        ```json
        <paste capture JSON here, or leave blank>
        ```
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
