name: Bug report
description: Something in MockTab doesn't work as it should
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything involving the pen, touch, or buttons, attach a capture from **Help › Collect Device Data…**, ideally taken while the problem happens.

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 27.0"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Tablet model
      placeholder: "e.g. Intuos Pro M (PTH-660)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Text from Info › Diagnostic Detail.
      render: text
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: The zip from Collect Device Data. Skip for purely visual or menu problems.
      placeholder: Drop the zip here.
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Checklist
      options:
        - label: No existing issue covers this.
          required: true
