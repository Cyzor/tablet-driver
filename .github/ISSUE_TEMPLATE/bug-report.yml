name: Bug report
description: Report a problem with MockTab on supported hardware
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before submitting:** in MockTab, open the Info pane and press **Copy Diagnostics** to bundle your driver state into a text block. Paste it in the **Diagnostics** field below.

        **If this bug involves the pen, touch, or buttons behaving wrong** (not tracking, wrong pressure/tilt, missed clicks, dropped touch, etc.), also use *Collect Device Data…* in the same Info tab to capture the raw HID traffic while the problem happens, and paste it in the **Capture data** field. Without it, confirming a later fix actually worked depends on you coming back to test it — a capture can be replayed against a fix without needing your hardware or a reply from you.

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 15.4"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Tablet model
      placeholder: "e.g. Intuos Pro Medium PTH-660"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the output of Info pane → Copy Diagnostics.
      placeholder: |
        ```
        <paste diagnostics output here>
        ```
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: Capture data
      description: |
        If the bug is about pen/touch/button behavior, paste the JSON from Info pane → Collect Device Data… while reproducing it. This is what lets a fix be verified against your exact hardware state later, even if you're not available to retest. Leave blank for bugs that aren't about device input (UI, menus, settings, etc.).
      placeholder: |
        ```json
        <paste capture JSON here, or leave blank>
        ```
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
